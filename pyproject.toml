[project]
name = "ragflow-modules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aspose-slides>=25.11.0",
    "beautifulsoup4==4.13.5",
    "chardet==5.2.0",
    "datrie==0.8.2",
    "hanziconv==0.3.2",
    "html5lib>=1.1",
    "loguru==0.7.3",
    "mammoth>=1.11.0",
    "markdown==3.8.2",
    "markdownify>=1.2.2",
    "mistune==3.1.4",
    "nltk==3.9.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow==11.3.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "requests==2.32.5",
    "tabulate>=0.9.0",
    "tiktoken==0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-html>=4.1.1",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
]

[tool.pytest.ini_options]
# 测试目录
testpaths = ["tests"]

# 测试文件匹配模式
python_files = ["test_*.py", "*_test.py"]

# 测试类匹配模式
python_classes = ["Test*"]

# 测试函数匹配模式
python_functions = ["test_*"]

# 最小版本要求
minversion = "7.0"

# 添加选项
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--html=reports/test_report.html",
    "--self-contained-html",
    "--cov=parser",
    "--cov=nlp",
    "--cov=dynamic_registry_demo",
    "--cov-report=html:reports/coverage",
    "--cov-report=term-missing",
    "--cov-fail-under=60"
]

# 标记定义
markers = [
    "slow: 标记测试为慢速测试",
    "integration: 标记为集成测试",
    "unit: 标记为单元测试",
    "parser: 标记为解析器相关测试",
    "nlp: 标记为NLP相关测试",
    "registry: 标记为注册系统相关测试"
]

# 过滤警告
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# 日志配置
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# 文件日志
log_file = "reports/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

# 测试发现
norecursedirs = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    "reports"
]

# 超时设置
timeout = 300
timeout_method = "thread"
